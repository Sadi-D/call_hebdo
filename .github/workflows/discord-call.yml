name: Discord Weekly Call

on:
  schedule:
    - cron: '00 17 * * 5'
      timezone: 'Europe/Paris'
    - cron: '50 17 * * 5'
      timezone: 'Europe/Paris'
  workflow_dispatch:

jobs:
  send-discord-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          MINUTE=$(TZ=Europe/Paris date +%M)

          if [ "$MINUTE" = "00" ]; then
            MESSAGE='@everyone\n🔔 **CALL HEBDOMADAIRE**\nPetit rappel : le call est prévu **à 18h** 🎙️'
          else
            MESSAGE='@everyone\n🚨 **CALL DANS 10 MINUTES**\nRendez-vous à **18h** dans le vocal 🎙️'
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"$MESSAGE\"}" \
            "$DISCORD_WEBHOOK"